version: '3'

set: [errexit, pipefail]

# VARIABLES ########################################################################################

vars:
  # GITLAB
  GITLAB_GROUP_ID: 120554361
  VISIBILITY: '{{.VISIBILITY | default "public"}}'
  # CHARTS
  CHARTS:
    map:
      kyverno:
        repoName: kyverno
        url: https://kyverno.github.io/kyverno/
        app: kyverno
        namespace: kyverno
      argo-cd:
        repoName: argo
        url: https://argoproj.github.io/argo-helm
        app: argo-cd
        namespace: argocd
      argo-workflows:
        repoName: argo
        url: https://argoproj.github.io/argo-helm
        app: argo-workflows
        namespace: argo
      argo-rollouts:
        repoName: argo
        url: https://argoproj.github.io/argo-helm
        app: argo-rollouts
        namespace: argo-rollouts
      argo-events:
        repoName: argo
        url: https://argoproj.github.io/argo-helm
        app: argo-events
        namespace: argo-events
      crossplane:
        repoName: crossplane-stable
        url: https://charts.crossplane.io/stable
        app: crossplane
        namespace: crossplane-system
      stakater:
        repoName: stakater
        url: https://stakater.github.io/stakater-charts
        app: reloader
        namespace: reloader
      prometheus:
        repoName: prometheus-community
        url: https://prometheus-community.github.io/helm-charts
        app: prometheus
        namespace: monitoring
      knative:
        repoName: knative-operator
        url: https://knative.github.io/operator
        app: knative-operator
        namespace:
      istio-operator:
        repoName: istio
        url: https://istio-release.storage.googleapis.com/charts
        app: istio # TO CHECK
        namespace: istio-system
      opencost:
        repoName: opencost
        url: https://opencost.github.io/opencost-helm-chart
        app: opencost
        namespace: cost-analyzer
      teleport:
        repoName: teleport
        url: https://charts.releases.teleport.dev
        app: teleport
        namespace: teleport
      
      grafana-operator:
        repoName: grafana
        url: https://grafana.github.io/helm-charts
        app: grafana-operator
        namespace: monitoring
      cert-manager:
        repoName: cert-manager
        url: https://charts.jetstack.io
        app: cert-manager
        namespace: cert-manager
      keda:
        repoName: kedacore
        url: https://kedacore.github.io/charts
        app: keda
        namespace: keda
      karpenter:
        repoName: karpenter
        url: https://charts.karpenter.sh/
        app: karpenter
        namespace: karpenter
      podinfo:
        repoName: podinfo
        url: https://stefanprodan.github.io/podinfo
        app: podinfo
        namespace: podinfo
      #kiali
      #loki
      #n8n
      #thanos
      #aws-load-balancer-controller
      #cilium
      #komoplane
      #kuik
      #twingate
      #velero
      #komiser: # DEAD ?
      #clickhouse
      #coder
      #external-snapshotter:

# INCLUDES #########################################################################################

includes:

# MAIN #############################################################################################

tasks:
  default:
    desc: ""
    summary: ""
    aliases: [setup, init]
    cmds:
      - task: helmWrapper:main
  
  helmWrapper:main:
    desc: ""
    summary: ""
    cmds:
      - echo ""
      - task: required:main
      - task: helm:main
      - task: directory:main
      - task: applicationSet:main
      - task: chart:main
      - task: values:main

# REQUIRED CHECK ###################################################################################

  required:main:
    desc: ""
    summary: ""
    cmds:
      - task: required:packages
      - task: required:gitlab:auth

  required:packages:
    desc: ""
    summary: ""
    internal: true
    silent: true
    cmds:
      - echo "required:packages"
      - command -v helm >/dev/null 2>&1 && echo "✅ helm" || { echo "❌ helm could not be found. Please install helm."; exit 1; }
      - command -v yq   >/dev/null 2>&1 && echo "✅ yq"   || { echo "❌ yq could not be found. Please install yq."; exit 1; }
      - command -v glab >/dev/null 2>&1 && echo "✅ glab" || { echo "❌ glab could not be found. Please install git."; exit 1; }
      - command -v sd   >/dev/null 2>&1 && echo "✅ sd"   || { echo "❌ sd could not be found. Please install sd."; exit 1; }
      - echo ""

  required:gitlab:auth:
    desc: ""
    summary: ""
    internal: true
    silent: true
    cmds:
      - echo "required:gitlab:auth"
      - glab auth status >/dev/null 2>&1 && echo "✅ glab authenticated" || { echo "❌ glab is not authenticated. Please authenticate with 'glab auth login'."; exit 1; }
      - echo ""

# HELM #############################################################################################

  helm:main:
    desc: ""
    summary: ""
    cmds:
      - task: helm:add:repositories    # OK
      - task: helm:update:repositories # OK

  helm:add:repositories:
    desc: "Add all Helm repositories"
    internal: true
    cmds:
      - echo "helm:add:repositories"
      - |
        {{range $key, $chart := .CHARTS}}
        if helm repo list | grep -q "^{{$chart.repoName}}\s"; then
          echo "⏭️  {{$chart.repoName}} already configured"
        else
          helm repo add "{{$chart.repoName}}" "{{$chart.url}}" >/dev/null 2>&1 && \
            echo "✅ {{$chart.repoName}} added" || \
            echo "❌ {{$chart.repoName}} failed"
        fi
        {{end}}
      - echo "✅ All repositories ready"
      - echo ""

  helm:update:repositories:
    desc: "Update all Helm repositories"
    summary: "Refreshes the local cache of all added Helm repositories to fetch latest chart versions"
    internal: true
    cmds:
      - echo "helm:update:repositories"
      - helm repo update
      - echo "✅ Repositories updated"
      - echo ""

# DIRECTORY ########################################################################################

  directory:main:
    desc: ""
    summary: ""
    cmds:
      - task: directory:copy:template         # OK
      - task: directory:rename:charts         # OK
      - task: directory:rename:applicationSet # OK

  directory:copy:template:
    desc: "Copy the template to all directories"
    summary: "Copies the template into all application directories"
    cmds:
      - echo "directory:copy:template"
      - |
        {{range $key, $chart := .CHARTS}}
        cp -r template {{$chart.app}}
        echo "✅ {{$chart.app}} copied"
        {{end}}
      - echo ""

  directory:rename:charts:
    desc: "Rename charts directories"
    summary: "Renames the charts folder inside each application directory."
    internal: true
    cmds:
      - echo "directory:rename:charts"
      - |
        {{range $key, $chart := .CHARTS}}
        mv {{$chart.app}}/charts/APP_NAME {{$chart.app}}/charts/{{$chart.app}} 2>/dev/null && \
          echo "✅ {{$chart.app}} renamed" || \
          echo "⏭️  {{$chart.app}} skipped"
        {{end}}
      - echo ""

  directory:rename:applicationSet:
    desc: "Rename application set YAML files"
    summary: "Renames the application set YAML files inside the apps folders"
    internal: true
    cmds:
      - echo "directory:rename:applicationSet"
      - |
        {{range $key, $chart := .CHARTS}}
        if [ -f "{{$chart.app}}/apps/APP_NAME-applicationSet.yaml" ]; then
          mv "{{$chart.app}}/apps/APP_NAME-applicationSet.yaml" "{{$chart.app}}/apps/{{$chart.app}}-applicationSet.yaml"
          echo "✅ {{$chart.app}} applicationSet renamed"
        else
          echo "⏭️  {{$chart.app}}/apps/APP_NAME-applicationSet.yaml not found"
        fi
        {{end}}
      - echo ""

# APPLICATIONSET ###################################################################################

  applicationSet:main:
    desc: ""
    summary: ""
    cmds:
      - task: applicationSet:update:placeholders

  applicationSet:update:placeholders:
    desc: ""
    cmds:
      - echo "applicationSet:update:placeholders"
      - |
        {{range $key, $chart := .CHARTS}}
        sd "APP_NAME" "{{$chart.app}}" "{{$chart.app}}/apps/{{$chart.app}}-applicationSet.yaml"
        echo "✅ {{$chart.app}} applicationSet updated"
        {{end}}
      - echo "✅ All applicationSet placeholders updated!"
      - echo ""

# CHART ############################################################################################

  chart:main:
    desc: ""
    summary: ""
    cmds:
      - task: chart:update:placeholders # OK

  chart:update:placeholders:
    desc: ""
    cmds:
      - echo "chart:update:placeholders"
      - |
        {{range $key, $chart := .CHARTS}}
        sd "APP_NAME" "{{$chart.app}}" "{{$chart.app}}/charts/{{$chart.app}}/Chart.yaml"
        sd "APP_VERSION" "$(helm search repo {{$chart.repoName}}/{{$chart.app}} --versions --devel | head -n 2 | tail -n 1 | awk '{print $3}')" "{{$chart.app}}/charts/{{$chart.app}}/Chart.yaml"
        sd "CHART_VERSION" "$(helm search repo {{$chart.repoName}}/{{$chart.app}} --versions --devel | head -n 2 | tail -n 1 | awk '{print $2}')" "{{$chart.app}}/charts/{{$chart.app}}/Chart.yaml"
        sd "REPO_NAME" "$(helm repo list | grep "^{{$chart.repoName}}" | awk '{print $1}')" "{{$chart.app}}/charts/{{$chart.app}}/Chart.yaml"
        sd "REPO_URL" "$(helm repo list | grep "^{{$chart.repoName}}" | awk '{print $2}')" "{{$chart.app}}/charts/{{$chart.app}}/Chart.yaml"
        echo "✅ {{$chart.app}} Chart.yaml updated"
        {{end}}
      - echo "✅ All Chart.yaml placeholders updated!"
      - echo ""

# VALUES ###########################################################################################

  values:main:
    desc: ""
    summary: ""
    cmds:
      - task: values:fetch:default
      - task: values:update:placeholders

  values:fetch:default:
    desc: "Fetch official values.yaml for all charts and save to values.yaml.default"
    summary: "Downloads the default values for each chart and saves them to values.yaml.default"
    cmds:
      - echo "values:fetch:default"
      - |
        {{range $key, $chart := .CHARTS}}
        helm show values "{{$chart.repoName}}/{{$chart.app}}" >> "{{$chart.app}}/charts/{{$chart.app}}/values.yaml.default" 2>/dev/null && \
          echo "✅ {{$chart.app}} values fetched" || \
          echo "❌ {{$chart.app}} values fetch failed"
        {{end}}
      - echo "✅ All values fetched!"
      - echo ""

  values:update:placeholders:
    desc: "Update values.default with correct placeholders for all charts"
    summary: "Updates placeholders in values.yaml.default files for each chart"
    cmds:
      - echo "values:update:placeholders"
      - |
        {{range $key, $chart := .CHARTS}}
        if [ -f "{{$chart.app}}/charts/{{$chart.app}}/values.yaml.default" ]; then
          sd "CHART_URL" "{{$chart.url}}" "{{$chart.app}}/charts/{{$chart.app}}/values.yaml.default"
          sd "CHART_REPO" "{{$chart.repoName}}" "{{$chart.app}}/charts/{{$chart.app}}/values.yaml.default"
          sd "CHART_NAME" "{{$chart.app}}" "{{$chart.app}}/charts/{{$chart.app}}/values.yaml.default"
          sd "CHART_APP_NAME" "{{$chart.app}}" "{{$chart.app}}/charts/{{$chart.app}}/values.yaml.default"
          sd "GENERATED_DATE" "$(date '+%Y-%m-%d %H:%M:%S')" "{{$chart.app}}/charts/{{$chart.app}}/values.yaml.default"
          echo "✅ {{$chart.app}} placeholders updated"
        else
          echo "⏭️  {{$chart.app}}/charts/{{$chart.app}}/values.yaml.default not found"
        fi
        {{end}}
      - echo "✅ All values placeholders updated!"
      - echo ""

