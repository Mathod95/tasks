      - echo "  task sudo:main                          Authentification sudo"
      - echo ""
      - echo "🔑 AGE"
      - echo "  task age:main                           Décrypter la clé age"
      - echo "  task age:decrypt:key                    Décrypter la clé age avec passphrase"
      - echo ""
      - echo "🌍 LOCALES"
      - echo "  task locales:main                       Configuration complète des locales"
      - echo "  task locales:install:package            Installer le package locales"
      - echo "  task locales:generate                   Générer la locale en_US.UTF-8"
      - echo ""
      - echo "🍺 HOMEBREW - INSTALLATION"
      - echo "  task brew:main                          Installation complète de Homebrew"
      - echo "  task brew:install:deps                  Installer les dépendances système"
      - echo "  task brew:install:binary                Installer le binaire Homebrew"
      - echo "  task brew:configure:path                Configurer le PATH pour Homebrew"
      - echo "  task brew:analytics:off                 Désactiver la télémétrie Homebrew"
      - echo "  task brew:install:packages              Installer les packages essentiels"
      - echo "  task brew:verify:packages               Vérifier les installations des packages"
      - echo ""
      - echo "🍺 HOMEBREW - MAINTENANCE"
